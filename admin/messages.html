<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контакт пораки</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{margin:0;background:#f5f5f5;color:#111827}.header{background:#111827;color:#fff;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.container{width:min(1250px,94%);margin:30px auto}h2{margin-bottom:20px}.back{color:#fff;text-decoration:none;background:#1f2937;padding:10px 20px;border-radius:6px}.table-wrap{overflow:auto;background:#fff;border-radius:10px;box-shadow:0 5px 18px rgba(0,0,0,.08)}table{width:100%;border-collapse:collapse;min-width:900px}th{background:#ff7a00;color:white;padding:13px}td{padding:13px;border-bottom:1px solid #ddd;vertical-align:top;text-align:left}.message{white-space:pre-wrap;min-width:300px}.delete{background:#b42318;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}.delete:hover{background:#c9362b}.empty{text-align:center;padding:30px;color:#6b7280}.summary{margin:0 0 15px;color:#6b7280;font-weight:700}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.badge.new{background:#fff3cd;color:#8a5a00}.badge.read{background:#dcfce7;color:#166534}.is-new td{background:#fffdf5}.status-btn{background:#1f2937;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;margin-right:6px;margin-bottom:6px}.status-btn:hover{background:#374151}.error{display:none;background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px;margin-bottom:15px}
</style>
</head>
<body>
<div class="header"><h2>Контакт пораки</h2><a class="back" href="dashboard.html">← Dashboard</a></div>
<div class="container">
<div class="error" id="error"></div><div class="summary" id="summary">Вкупно: — • Нови: —</div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Име</th><th>Email</th><th>Телефон</th><th>Порака</th><th>Датум</th><th>Статус</th><th>Акција</th></tr></thead><tbody id="messagesTable"></tbody></table></div>
</div>
<script src="js/messages.js"></script>
<script src="js/login.js"></script>
</body>
</html>
