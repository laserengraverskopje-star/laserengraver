<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог и цени</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:#f4f4f4;color:#111827}
.header{background:#111827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:10}
.header h2{margin:0;color:#ff7a00}.back{color:#fff;text-decoration:none;background:#1f2937;padding:10px 16px;border-radius:7px}
.container{width:min(1450px,96%);margin:25px auto}.notice{background:#fff;padding:15px 18px;border-radius:10px;margin-bottom:18px;box-shadow:0 4px 15px rgba(0,0,0,.07);line-height:1.6}
.tabs{display:flex;gap:10px;margin-bottom:18px}.tab{border:0;background:#d1d5db;color:#111827;padding:11px 18px;border-radius:8px;font-weight:700;cursor:pointer}.tab.active{background:#ff7a00;color:#fff}
.toolbar{display:grid;grid-template-columns:1fr 240px;gap:12px;margin-bottom:18px}.search,.category-filter{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px;background:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}.product{background:#fff;border-radius:12px;padding:14px;box-shadow:0 5px 18px rgba(0,0,0,.08)}
.product img{width:100%;height:230px;object-fit:cover;border-radius:8px;background:#eee;cursor:pointer}.slot{font-size:12px;color:#6b7280;margin-top:8px;word-break:break-all}.grid-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.product label{display:block;font-weight:bold;margin:12px 0 6px}.product input,.product textarea,.product select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:7px;font-size:14px;background:#fff}.product textarea{min-height:90px;resize:vertical}
.save{margin-top:12px;width:100%;background:#ff7a00;color:#fff;border:0;border-radius:7px;padding:11px;font-weight:bold;cursor:pointer}.save:hover{background:#ff9500}.status{font-size:13px;margin-top:7px;min-height:18px}.saved{color:#16803b}.error{color:#c62828}
.preview{margin-top:10px;padding:10px;background:#f8fafc;border-radius:8px;font-size:13px;color:#475569}.hidden{display:none!important}
@media(max-width:700px){.header{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr}.grid-two{grid-template-columns:1fr}.products{grid-template-columns:1fr}.product img{height:210px}}
</style>
</head>
<body>
<div class="header"><h2>Каталог / Цени / Производи</h2><a class="back" href="dashboard.html">← Dashboard</a></div>
<div class="container">
<div class="notice">
  Овде можеш за <b>секоја позиција во Галерија 1 и Галерија 2</b> да избираш друга слика, категорија, име на производ, цена и опис. Промените се зачувуваат на серверот и се прикажуваат на веб-страницата.
</div>
<div class="tabs"><button class="tab active" data-gallery="gallery1">Галерија 1</button><button class="tab" data-gallery="gallery2">Галерија 2</button></div>
<div class="toolbar"><input class="search" id="search" type="search" placeholder="Пребарај производ, слика или категорија..."><select class="category-filter" id="categoryFilter"><option value="">Сите категории</option></select></div>
<div class="products" id="products"></div>
</div>
<script src="js/products.js"></script>
</body>
</html>
