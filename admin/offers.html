<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Понуди</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        .header{
            background:#111827;
            color:white;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .container{
            width:90%;
            margin:30px auto;
        }

        h2{
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:10px;
            overflow:hidden;
        }

        th{
            background:#ff7a00;
            color:white;
            padding:15px;
        }

        td{
            padding:15px;
            border-bottom:1px solid #ddd;
            text-align:center;
        }

        button{
            background:#ff7a00;
            color:white;
            border:none;
            padding:8px 15px;
            border-radius:6px;
            cursor:pointer;
        }

        button:hover{
            background:#ff9500;
        }

        .back{
            text-decoration:none;
            color:white;
            background:#111827;
            padding:10px 20px;
            border-radius:6px;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>Понуди</h2>

    <a class="back" href="dashboard.html">← Dashboard</a>
</div>

<div class="container">

<table>

<thead>
<tr>
<th>ID</th>
<th>Име</th>
<th>Email</th>
<th>Телефон</th>
<th>Услуга</th>
<th>Материјал</th>
<th>Датум</th>
<th>Акција</th>
</tr>
</thead>

<tbody id="offersTable">


</tbody>

</table>

</div>
<script src="js/offers.js"></script>
</body>
</html>
